name: healthy-bites · instancia caliente

# Vercel apaga la instancia de la API de Healthy Bites tras 5 minutos sin tráfico, y arrancarla de nuevo cuesta unos
# 8 s a quien llega. Cada 5 minutos (lo mínimo que permite GitHub, que además puede retrasar las ejecuciones) se llama
# dos veces a la sonda de vida, con 2,5 minutos entre una y otra. La sonda no consulta la base de datos: Neon puede
# seguir suspendiéndose (ADR 0011 de la API).
#
# GitHub desactiva los workflows programados de los repos públicos tras 60 días sin actividad (avisa por correo):
# se reactiva desde la pestaña Actions.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: healthy-bites-keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sonda de vida de la API
        env:
          URL: https://api-healthybites.vfernandezg.dev/api/v1/actuator/health/liveness
        run: |
          for i in 1 2; do
            curl --silent --show-error --fail --max-time 30 --user-agent healthy-bites-keep-warm \
              --output /dev/null --write-out "%{http_code} en %{time_total} s\n" "$URL" \
              || echo "::warning::La API no respondió a la sonda de vida"
            if [ "$i" = 1 ]; then sleep 150; fi
          done
